# Default configuration for charlie-code.
# Templates use {{name}} placeholders (double braces) so they never collide with
# shell syntax in example commands. They are filled by agent.render().

model:
  model_name: "openai/your-org/your-model"
  api_base: "https://YOUR_SGLANG_HOST/v1"
  # stream selects how the call is made; timeout_seconds is the budget passed to
  # litellm as `timeout`: the silence bound between streamed chunks when
  # streaming, the whole-call bound when not.
  stream: true
  timeout_seconds: 1200
  # Optional sampling knobs, forwarded to litellm.completion. null keeps the
  # field out of the request body, so the endpoint's own default applies.
  # Overridable per invocation with --top-p / --temperature or the
  # CHARLIE_CODE_TOP_P / CHARLIE_CODE_TEMPERATURE environment variables.
  top_p: null
  temperature: null

agent:
  step_limit: 1000

# Context reset. Every command's output is bounded on its own before it enters
# the context (command_observation_chars: head and tail halves around a one-line
# marker stating the full output's totals). History is append-only and never
# rewritten. Before each model call the agent estimates the context as the last
# measured prompt_tokens plus chars/4 of what was appended since (chars/4 of the
# whole context when there is no measurement yet); at or above
# threshold_fraction * context_window it rebuilds the context as three messages:
# the system message, a one-line pointer to the session's transcript and command
# log directory (templates.reset_pointer), and this turn's task. Older material
# stays on disk and the model reads it back with rg. An over-window error from
# the endpoint runs the same reset and retries the call once.
# context_window can be overridden per invocation with --context-window.
compact:
  context_window: 262144           # model window in tokens; --context-window overrides per invocation
  threshold_fraction: 0.65         # reset when the estimate reaches threshold_fraction * context_window
  command_observation_chars: 5000  # per-command cap on the output entering the context: head and tail halves around a one-line total marker

environment:
  # Seconds after which a running command reports progress (a command_progress
  # event, rendered by the harness as a chat note), and the cap after which a
  # command still running is terminated: SIGTERM to its process group, SIGKILL
  # five seconds later if needed. The notices increase and stay below the cap.
  progress_notices_seconds: [60, 300]
  kill_after_seconds: 900

skills:
  # Host level, in precedence order; a missing directory is skipped. --skills-root or
  # CHARLIE_CODE_SKILLS_ROOT (a single path) replaces this list for one run.
  roots:
    - "~/.agents/skills"
    - "~/.claude/skills"
  # Repo level, relative to the git worktree root that contains the working
  # directory; scanned before the host roots, so a repo skill wins a name collision.
  repo_dirs:
    - ".claude/skills"
    - ".agents/skills"

session:
  dir: "~/.charlie-code/sessions"

templates:
  system: |
    You have exactly one tool, `bash`. You call it with a command and receive
    its combined stdout/stderr and exit code as the tool result, then continue from
    there. You may issue several bash calls in one reply; they run in the order
    you gave them.

    Each command runs in a fresh subprocess: exported variables, the current
    directory (`cd`), and other shell state reset between commands. Chain commands
    with `&&` in a single call when they must share state, and prefer absolute
    paths. Your working directory is: {{cwd}}

    Use `rg` rather than `grep` to search in fs.

    Command duration: a command runs in the foreground and returns when it exits; a command
    still running after {{kill_after_minutes}} minutes is terminated, and you get its output so far
    with a note saying so. Run in the foreground a command you expect to finish within a minute,
    or whose result you need before you can do anything else. Start anything you expect to
    outlast {{kill_after_minutes}} minutes in its own session, `setsid nohup cmd > log 2>&1 & echo $!`,
    record its pid and log path, and wait for it as your role prompt describes.

    Background commands: `background: true` starts the command and returns at once with its task
    id, pid and log path, and the command keeps running under the same {{kill_after_minutes}}-minute
    cap. It suits a command you expect to take more than a minute while you have other work to do
    meanwhile, such as a test run while you read the next file. Its exit code and output arrive
    appended to a later tool result under a `[background task ...]` heading, so the result reaches
    you without polling. When only that result remains, wait for it with
    `timeout N tail --pid=PID -f LOG`, which returns when the task exits or after N seconds; stop a
    task with `kill PID`. The parameter is the one way to run a command in the background: a
    process forked with a trailing `&` belongs to the call's process group, which is reaped when
    the call returns. Your final answer takes effect once every background task has ended; a reply
    that ends the task while one is still running gets a reminder naming it.

    {{skills}}

    Ending your turn:
    - A reply with no tool call ends the session and is delivered to the user as
      your answer, whether it solves the task, asks the user a question, or waits
      for a later event (a wake-up, a job, a reply). To keep working, call the
      `bash` tool.

    Model control markers:
    - The role and tool-call markers of your own chat template are special tokens
      for your endpoint, and a reply that spells one out ends at that point. Refer
      to them by name (the user role marker, the tool_call opening tag), and read
      code that carries them through a transform such as a sed substitution, so the
      marker itself never enters your reply.

  instance: |
    Please complete the following task:

    {{task}}

  observation: |
    Exit code: {{returncode}}
    Output:
    {{output}}

  # The tool result of a call made with background=true: the task id, pid and log
  # path, and the commands that wait for or stop the task. Its exit record
  # (background_exit) rides appended to a later tool result.
  background_started: |
    Background task {{task_id}} started: pid {{pid}}, log {{log}}.
    Its exit code and output arrive appended to a later tool result.
    Wait: timeout N tail --pid={{pid}} -f {{log}}   Stop: kill {{pid}}

  # One exited background task, appended to a later tool result. outcome reads
  # "exited: code N", or "terminated at the <cap> cap: code N" when the cap ended
  # it; command is the command's first 80 characters; output is gated and bounded
  # like any observation.
  background_exit: |
    [background task {{task_id}} {{outcome}} after {{seconds}} s; command: {{command}}; log: {{log}}]
    Output:
    {{output}}

  # Appended when a reply ends the run while background tasks are still running.
  # tasks reads "background task s-4-1 is still running (pid 12345, 130 s of
  # 15 min; log /path/s-4-1.log)"; several tasks are listed in one phrase.
  background_running_reminder: |
    Your reply ended the task while {{tasks}}. Wait for it with
    `timeout N tail --pid=PID -f LOG`, stop it with `kill PID`, or restart it detached with
    setsid nohup if it must outlive this session; then send the final answer again.

  # Appended when a reply ends the run while exited tasks' records were still
  # undelivered; the records stand above it in the same message.
  background_delivered_reminder: |
    Your reply ended the task while background task results were still on their way; they
    are above. Send the final answer again.

  # The one user message a rebuilt context carries besides the task. Rendered
  # once per session from the transcript's absolute path and the session's .d
  # directory (command logs, one file per command), so it is byte-identical for
  # the whole session.
  reset_pointer: >-
    Context was rebuilt; your earlier work is recorded on disk. Step log:
    {{transcript}}. Full command outputs: {{session_dir}}/. Start by running rg on
    these two paths to pick up where you left off.
