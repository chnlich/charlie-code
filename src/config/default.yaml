# Default configuration for charlie-code.
# Templates use {{name}} placeholders (double braces) so they never collide with
# shell syntax in example commands. They are filled by agent.render().

model:
  model_name: "openai/your-org/your-model"
  api_base: "https://YOUR_SGLANG_HOST/v1"
  idle_seconds: 1200  # seconds without a streamed chunk before the call fails; a call that keeps producing has no time limit

agent:
  step_limit: 1000

# Layered context compaction. Every observation entering history is bounded by the
# per-step entry budget; at a step boundary whose measured prompt tokens (plus a
# chars/4 estimate of what was appended since) reach threshold_fraction *
# context_window, old tool observations are masked with re-readable placeholders,
# and if that is still not enough the history is rebuilt as [system, task,
# summary, verbatim tail]. An over-window error from the endpoint runs the same
# compaction and retries the call once. context_window can be overridden per
# invocation with --context-window.
#
# Config invariant: mask_keep_steps x the per-step entry budget plus
# tail_budget_tokens plus fixed overhead (system + task + summary) must leave
# headroom under context_window. Defaults: 8 x ~10k tokens + 24k tail + ~1.2k
# overhead ~= 105k tokens against a 262144 window (~157k headroom).
compact:
  context_window: 262144
  threshold_fraction: 0.65
  mask_keep_steps: 8
  tail_budget_tokens: 24000
  step_observation_budget_chars: 40000

environment:
  timeout: 60

skills:
  # Host level, in precedence order; a missing directory is skipped. --skills-root or
  # CHARLIE_CODE_SKILLS_ROOT (a single path) replaces this list for one run.
  roots:
    - "~/.agents/skills"
    - "~/.claude/skills"
  # Repo level, relative to the git worktree root that contains the working
  # directory; scanned before the host roots, so a repo skill wins a name collision.
  repo_dirs:
    - ".claude/skills"
    - ".agents/skills"

session:
  dir: "~/.charlie-code/sessions"

templates:
  system: |
    You have exactly one tool, `bash`. You call it with a command and receive
    its combined stdout/stderr and exit code as the tool result, then continue from
    there. You may issue several bash calls in one reply; they run in the order
    you gave them.

    Each command runs in a fresh subprocess: exported variables, the current
    directory (`cd`), and other shell state reset between commands. Chain commands
    with `&&` in a single call when they must share state, and prefer absolute
    paths. Your working directory is: {{cwd}}

    Long-running commands: a command still running past ~60s keeps running in the
    background, and you get back its pid, the absolute path of its still-growing
    log file, and its output so far. Polling it, doing other work and checking
    back later, and killing it yourself with plain bash (`tail`, `kill -0`,
    `kill`) are all equally fine. Background work that must keep running after its
    own command returns starts in its own session, `setsid nohup cmd > log 2>&1
    & echo $!`; anything started without that ends with the command that
    launched it.

    {{skills}}

    Completing the task:
    - When the task is fully solved, end the session with your final answer as
      plain text in a reply that carries no tool call.
    - A reply carrying neither a tool call nor any text keeps the session open;
      you are asked to continue.

  instance: |
    Please complete the following task:

    {{task}}

  observation: |
    Exit code: {{returncode}}
    Output:
    {{output}}

  empty_response_reminder: |
    Your last reply contained neither a tool call nor any text. Either call the `bash`
    tool with the next command, or reply with your final answer as plain text.

  compact_prompt: |
    You are compacting the conversation of an autonomous software engineering
    agent (your own session) to fit the model context window. The conversation
    above is the full session so far. After compaction, the most recent messages
    remain available verbatim, so do NOT restate their detail; summarize what is
    not in them. If the conversation already contains an earlier summary, inherit
    every fact in it that is still valid.

    Write a structured handoff summary with exactly these five sections:
    1. Progress and decisions: what has been accomplished and which decisions
       were made, including the reasons behind non-obvious ones.
    2. Unresolved issues: problems still open, with what is known about each.
    3. Attempted and failed paths: approaches already tried that did not work,
       so they are not retried.
    4. Key paths and commands: file paths, commands, and other concrete handles
       the remaining work depends on.
    5. Remaining steps: what still has to happen to complete the task.

    Be terse and factual. Reply with the summary only, as plain text.

  compact_summary_prefix: |
    Another model has summarized the session so far to fit the context window.
    Its summary follows; the messages after it are the most recent steps, kept
    verbatim.

    Summary of the session so far:
