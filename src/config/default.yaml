# Default configuration for charlie-code.
# Templates use {{name}} placeholders (double braces) so they never collide with
# shell syntax in example commands. They are filled by agent.render().

model:
  model_name: "openai/your-org/your-model"
  api_base: "https://YOUR_SGLANG_HOST/v1"
  # stream selects how the call is made; timeout_seconds is the budget passed to
  # litellm as `timeout`: the silence bound between streamed chunks when
  # streaming, the whole-call bound when not.
  stream: true
  timeout_seconds: 1200
  # Optional sampling knobs, forwarded to litellm.completion. null keeps the
  # field out of the request body, so the endpoint's own default applies.
  # Overridable per invocation with --top-p / --temperature or the
  # CHARLIE_CODE_TOP_P / CHARLIE_CODE_TEMPERATURE environment variables.
  top_p: null
  temperature: null

agent:
  step_limit: 1000
  # The last line of a final answer; removed before the answer is delivered.
  # A tool-less reply whose last line is not this one, or that carries this
  # line with no answer above it, is unfinished: the model is reminded and the
  # run continues.
  completion_sentinel: "[[END OF FINAL ANSWER]]"
  # Consecutive tool-less replies without a complete final answer before the
  # run fails, so a model that never learns the line costs three reminders
  # rather than the whole step limit. Any reply carrying a tool call resets it.
  unfinished_reply_limit: 3

# Layered context compaction. Every observation entering history is bounded by the
# per-step entry budget. At a step boundary whose measured prompt tokens (plus a
# chars/4 estimate of what was appended since) reach threshold_fraction *
# context_window AND stand at least min_gain_tokens above the target line, the
# ladder runs in order - mask old observations, drop old reasoning, elide old
# command bodies, rebuild from a summary - and stops as soon as the estimate is
# at or below the target line, so one compaction buys tens of steps instead of a
# few. Every text a level lifts out of history is saved under the run's session
# log directory and the placeholder names that file. An over-window error from
# the endpoint goes straight to the summarize level and retries the call once.
# context_window can be overridden per invocation with --context-window.
#
# The target line is target = max(target_fraction * context_window, floor) with
# floor = system prompt + task + keep_tail_tokens: the floor is what compaction
# cannot remove, so a target under it would only make the ladder run to its end
# in vain. A floor at or above the window fails at startup; a floor between the
# threshold line and the window warns once and runs on the over-window path.
compact:
  context_window: 262144
  threshold_fraction: 0.65
  target_fraction: 0.30
  # A compaction must buy at least this much space above the target line to be
  # worth the full re-prefill it causes; below that, history grows instead.
  min_gain_tokens: 16384
  # Token cost of one image part when estimating the floor: the base64 length
  # of an image says nothing about its token count.
  image_tokens: 1600
  # Levels to run, in order; removing a level is the retreat when a backend
  # rejects the rewritten history.
  ladder: [mask, reasoning, command, summarize]
  # Verbatim tail the first three levels keep, in tokens, cut on whole-step
  # boundaries. Replaces the old step-count knob mask_keep_steps.
  keep_tail_tokens: 15000
  # Verbatim tail the summarize level keeps when it rebuilds the history.
  tail_budget_tokens: 24000
  # Head of an old command body kept when the command level elides the rest.
  command_head_chars: 200
  step_observation_budget_chars: 40000

environment:
  # Seconds after which a running command reports progress (a command_progress
  # event, rendered by the harness as a chat note), and the cap after which a
  # command still running is terminated: SIGTERM to its process group, SIGKILL
  # five seconds later if needed. The notices increase and stay below the cap.
  progress_notices_seconds: [60, 300]
  kill_after_seconds: 900

skills:
  # Host level, in precedence order; a missing directory is skipped. --skills-root or
  # CHARLIE_CODE_SKILLS_ROOT (a single path) replaces this list for one run.
  roots:
    - "~/.agents/skills"
    - "~/.claude/skills"
  # Repo level, relative to the git worktree root that contains the working
  # directory; scanned before the host roots, so a repo skill wins a name collision.
  repo_dirs:
    - ".claude/skills"
    - ".agents/skills"

session:
  dir: "~/.charlie-code/sessions"

templates:
  system: |
    You have exactly one tool, `bash`. You call it with a command and receive
    its combined stdout/stderr and exit code as the tool result, then continue from
    there. You may issue several bash calls in one reply; they run in the order
    you gave them.

    Each command runs in a fresh subprocess: exported variables, the current
    directory (`cd`), and other shell state reset between commands. Chain commands
    with `&&` in a single call when they must share state, and prefer absolute
    paths. Your working directory is: {{cwd}}

    Long-running commands: a command runs in the foreground and returns when it exits; the tool waits for it and
    reports progress to CharlieBot while it runs. A command still running after {{kill_after_minutes}} minutes is
    terminated, and you get its output so far with a note saying so. Run a command in the foreground when you
    expect it to finish within five minutes; start anything longer in its own session, `setsid nohup cmd > log
    2>&1 & echo $!`, record its pid and log path, and wait for it as your role prompt describes.

    {{skills}}

    Completing the task:
    - When the task is fully solved, reply with your final answer as plain text, no
      tool call, and make its last line exactly:
      {{completion_sentinel}}
      That line is what ends the session; it is removed from the delivered answer.
    - A reply with no tool call whose last line is not that line keeps the session
      open: you are asked to continue, and a finished answer is sent again in full
      with the line at its end.

  instance: |
    Please complete the following task:

    {{task}}

  observation: |
    Exit code: {{returncode}}
    Output:
    {{output}}

  unfinished_reply_reminder: |
    Your last reply carried no tool call and did not end with the line
    {{completion_sentinel}}
    Either call the `bash` tool with the next command, or send the complete final
    answer again, ending with that line.

  compact_prompt: |
    You are compacting the conversation of an autonomous software engineering
    agent (your own session) to fit the model context window. The conversation
    above is the full session so far. After compaction, the most recent messages
    remain available verbatim, so do NOT restate their detail; summarize what is
    not in them. If the conversation already contains an earlier summary, inherit
    every fact in it that is still valid.

    Write a structured handoff summary with exactly these five sections:
    1. Progress and decisions: what has been accomplished and which decisions
       were made, including the reasons behind non-obvious ones.
    2. Unresolved issues: problems still open, with what is known about each.
    3. Attempted and failed paths: approaches already tried that did not work,
       so they are not retried.
    4. Key paths and commands: file paths, commands, and other concrete handles
       the remaining work depends on.
    5. Remaining steps: what still has to happen to complete the task.

    Be terse and factual. Reply with the summary only, as plain text.

  compact_summary_prefix: |
    Another model has summarized the session so far to fit the context window.
    Its summary follows; the messages after it are the most recent steps, kept
    verbatim.

    Summary of the session so far:
