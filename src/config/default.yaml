# Default configuration for charlie-code.
# Templates use {{name}} placeholders (double braces) so they never collide with
# shell syntax in example commands. They are filled by agent.render().

model:
  model_name: "openai/your-org/your-model"
  api_base: "https://YOUR_SGLANG_HOST/v1"
  # stream selects how the call is made; timeout_seconds is the budget passed to
  # litellm as `timeout`: the silence bound between streamed chunks when
  # streaming, the whole-call bound when not.
  stream: true
  timeout_seconds: 1200
  # Optional sampling knobs, forwarded to litellm.completion. null keeps the
  # field out of the request body, so the endpoint's own default applies.
  # Overridable per invocation with --top-p / --temperature or the
  # CHARLIE_CODE_TOP_P / CHARLIE_CODE_TEMPERATURE environment variables.
  top_p: null
  temperature: null

agent:
  step_limit: 1000
  # The last line of a final answer; removed before the answer is delivered.
  # A tool-less reply whose last line is not this one, or that carries this
  # line with no answer above it, is unfinished: the model is reminded and the
  # run continues.
  completion_sentinel: "[[END OF FINAL ANSWER]]"
  # Consecutive tool-less replies without a complete final answer before the
  # run fails, so a model that never learns the line costs three reminders
  # rather than the whole step limit. Any reply carrying a tool call resets it.
  unfinished_reply_limit: 3

# Context reset. Every command's output is bounded on its own before it enters
# the context (command_observation_chars: head and tail halves around a one-line
# marker stating the full output's totals). History is append-only and never
# rewritten. Before each model call the agent estimates the context as the last
# measured prompt_tokens plus chars/4 of what was appended since (chars/4 of the
# whole context when there is no measurement yet); at or above
# threshold_fraction * context_window it rebuilds the context as three messages:
# the system message, a one-line pointer to the session's transcript and command
# log directory (templates.reset_pointer), and this turn's task. Older material
# stays on disk and the model reads it back with rg. An over-window error from
# the endpoint runs the same reset and retries the call once.
# context_window can be overridden per invocation with --context-window.
compact:
  context_window: 262144           # model window in tokens; --context-window overrides per invocation
  threshold_fraction: 0.65         # reset when the estimate reaches threshold_fraction * context_window
  command_observation_chars: 5000  # per-command cap on the output entering the context: head and tail halves around a one-line total marker

environment:
  # Seconds after which a running command reports progress (a command_progress
  # event, rendered by the harness as a chat note), and the cap after which a
  # command still running is terminated: SIGTERM to its process group, SIGKILL
  # five seconds later if needed. The notices increase and stay below the cap.
  progress_notices_seconds: [60, 300]
  kill_after_seconds: 900

skills:
  # Host level, in precedence order; a missing directory is skipped. --skills-root or
  # CHARLIE_CODE_SKILLS_ROOT (a single path) replaces this list for one run.
  roots:
    - "~/.agents/skills"
    - "~/.claude/skills"
  # Repo level, relative to the git worktree root that contains the working
  # directory; scanned before the host roots, so a repo skill wins a name collision.
  repo_dirs:
    - ".claude/skills"
    - ".agents/skills"

session:
  dir: "~/.charlie-code/sessions"

templates:
  system: |
    You have exactly one tool, `bash`. You call it with a command and receive
    its combined stdout/stderr and exit code as the tool result, then continue from
    there. You may issue several bash calls in one reply; they run in the order
    you gave them.

    Each command runs in a fresh subprocess: exported variables, the current
    directory (`cd`), and other shell state reset between commands. Chain commands
    with `&&` in a single call when they must share state, and prefer absolute
    paths. Your working directory is: {{cwd}}

    Use `rg` rather than `grep` to search in fs.

    Long-running commands: a command runs in the foreground and returns when it exits; the tool waits for it and
    reports progress to CharlieBot while it runs. A command still running after {{kill_after_minutes}} minutes is
    terminated, and you get its output so far with a note saying so. Run a command in the foreground when you
    expect it to finish within five minutes; start anything longer in its own session, `setsid nohup cmd > log
    2>&1 & echo $!`, record its pid and log path, and wait for it as your role prompt describes.

    {{skills}}

    Completing the task:
    - When the task is fully solved, reply with your final answer as plain text, no
      tool call, and make its last line exactly:
      {{completion_sentinel}}
      That line is what ends the session; it is removed from the delivered answer.
    - A reply with no tool call whose last line is not that line keeps the session
      open: you are asked to continue, and a finished answer is sent again in full
      with the line at its end.

  instance: |
    Please complete the following task:

    {{task}}

  observation: |
    Exit code: {{returncode}}
    Output:
    {{output}}

  unfinished_reply_reminder: |
    Your last reply carried no tool call and did not end with the line
    {{completion_sentinel}}
    Either call the `bash` tool with the next command, or send the complete final
    answer again, ending with that line.

  # The one user message a rebuilt context carries besides the task. Rendered
  # once per session from the transcript's absolute path and the session's .d
  # directory (command logs, one file per command), so it is byte-identical for
  # the whole session.
  reset_pointer: >-
    Context was rebuilt; your earlier work is recorded on disk. Step log:
    {{transcript}}. Full command outputs: {{session_dir}}/. Start by running rg on
    these two paths to pick up where you left off.
